<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scrapefold">
  <title>Scrapefold</title>
  <defs>
    <linearGradient id="sf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CF0"/>
      <stop offset="1" stop-color="#5A48D6"/>
    </linearGradient>
  </defs>

  <!-- Mark: stacked "fold" layers suggesting the cheap->expensive engine ladder -->
  <g transform="translate(24 30)">
    <rect x="0"  y="0"  width="92" height="22" rx="5" fill="url(#sf-accent)" opacity="0.45"/>
    <rect x="10" y="26" width="92" height="22" rx="5" fill="url(#sf-accent)" opacity="0.65"/>
    <rect x="20" y="52" width="92" height="22" rx="5" fill="url(#sf-accent)" opacity="0.85"/>
    <rect x="30" y="78" width="92" height="22" rx="5" fill="url(#sf-accent)"/>
    <!-- cascade arrow -->
    <path d="M118 14 L138 50 L118 86" stroke="#5A48D6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#1A1730">Scrape</tspan><tspan fill="url(#sf-accent)">fold</tspan>
  </text>
</svg>
